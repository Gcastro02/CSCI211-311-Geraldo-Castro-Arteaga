<!DOCTYPE html>
<html>
<head>
    <title>Internship Copilot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Internship Copilot</h1>

    <h2>Profile</h2>
    <textarea id="resume" placeholder="Paste your resume here"></textarea>

    <br><br>

    <h2>Results</h2>
    <pre id="output"></pre>

    <script src="/static/app.js"></script>
</body>
</html>
